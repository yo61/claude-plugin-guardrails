version: 2
updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Use a conventional type accepted by commitlint for PR titles.
    commit-message:
      prefix: "chore"
    groups:
      hooks:
        patterns: ["*"]

  # GitHub Actions. Pins are SHAs with version comments; Dependabot
  # rewrites both. Majors stay outside the group so they arrive singly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
